<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chess Game</h1>
        
        <div class="info-panel">
            <div class="player-info">
                <span id="currentPlayer">White to move</span>
            </div>
            <div class="game-status">
                <span id="gameStatus"></span>
            </div>
            <div class="move-info">
                <span id="moveInfo">Click a piece to select it, then click a square to move</span>
            </div>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button id="resetBtn" class="btn">New Game</button>
            <button id="undoBtn" class="btn">Undo</button>
        </div>

        <div class="captured-pieces">
            <div class="captured-section">
                <h3>Captured by White</h3>
                <div id="capturedByWhite" class="captured-list"></div>
            </div>
            <div class="captured-section">
                <h3>Captured by Black</h3>
                <div id="capturedByBlack" class="captured-list"></div>
            </div>
        </div>

        <div class="move-history">
            <h3>Move History</h3>
            <div id="moveHistory" class="move-list"></div>
        </div>
    </div>

    <script src="chess.js"></script>
</body>
</html>
